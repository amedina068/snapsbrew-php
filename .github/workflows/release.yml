# Releases the package. This workflow runs only by hand.
#
# It does the checks, then creates a git tag and a GitHub release.
# Packagist reads the new tag through its GitHub integration. The
# repository has no Packagist secret, and this workflow does not call
# Packagist.
#
# Before the first release, submit the repository on Packagist one time:
# https://packagist.org/packages/submit with the URL
# https://github.com/amedina068/snapsbrew-php. After that, the Packagist
# GitHub hook updates the package for each new tag.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Make sure that the version is valid
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          grep -q "const VERSION = '${{ inputs.version }}'" src/Snapsbrew.php
          grep -q "## \[${{ inputs.version }}\]" CHANGELOG.md

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Install the dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run the checks
        run: |
          composer validate --strict --no-check-lock
          vendor/bin/pint --test
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress
          vendor/bin/pest

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes "Read CHANGELOG.md for the changes in this version." \
            --target "${{ github.sha }}"
