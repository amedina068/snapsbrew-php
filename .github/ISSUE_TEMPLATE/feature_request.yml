name: Feature request
description: Ask for a new feature in the SDK.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Write the task that you cannot do now.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution that you want
      description: Write the API that you want. Add a short code example.
      render: php
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other solutions
      description: Write the other solutions that you examined.
